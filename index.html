    // --- BỘ VẼ ICON UNIVERSAL (Tương thích 100% Lucide CDN & Fallback SVG) ---
    const Icon = ({ name, className = '', size = 16, style = {}, ...rest }) => {
      // Tra cứu từ window.lucide nếu có
      const lucideObj = window.lucide;
      let iconNodes = null;

      if (lucideObj) {
        if (lucideObj[name]) iconNodes = lucideObj[name];
        else if (lucideObj.icons && lucideObj.icons[name]) iconNodes = lucideObj.icons[name];
      }

      if (iconNodes && Array.isArray(iconNodes)) {
        return (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width={size}
            height={size}
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
            className={className}
            style={style}
            {...rest}
          >
            {iconNodes.map(([tag, attrs], idx) => React.createElement(tag, { key: idx, ...attrs }))}
          </svg>
        );
      }

      // Fallback SVG đơn giản nếu CDN chưa kịp tải
      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
          style={style}
          {...rest}
        >

        </svg>
      );
    };

    // --- HÀM NÉN ẢNH CLIENT-SIDE ĐẢM BẢO KHÔNG TRÀN STORAGE ---
    function processImageFile(file, maxWidth = 900, maxHeight = 900, quality = 0.8) {
      return new Promise((resolve, reject) => {
        if (!file.type.startsWith('image/')) {
          reject(new Error('Tệp không phải là hình ảnh hợp lệ.'));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Không thể đọc tệp.'));
        reader.onload = (e) => {
          const img = new Image();
          img.onerror = () => reject(new Error('Không thể tải ảnh.'));
          img.onload = () => {
            let { width, height } = img;
            if (width > maxWidth || height > maxHeight) {
              if (width / height > maxWidth / maxHeight) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              } else {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            if (!ctx) {
              resolve(e.target.result);
              return;
            }
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    const DEFAULT_SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbxOYOdCVdiklbpsSPrpl4C1I9w1-0ZXNG3XAXpK85MNjg77WzYgDcKtZT7mLB0msE0_eQ/exec";

    // Hàm gửi dữ liệu POST đến Google Apps Script Web App
    async function postToGoogleSheets(apiUrl, payload) {
      const targetUrl = (apiUrl || DEFAULT_SHEETS_API_URL).trim();
      if (!targetUrl) {
        throw new Error('Chưa cấu hình URL Google Apps Script Web App');
      }

      // Kỹ thuật gửi Google Apps Script qua fetch:
      // Sử dụng text/plain và mode 'no-cors' để tránh lỗi chặn CORS Preflight OPTIONS của trình duyệt
      await fetch(targetUrl, {
        method: 'POST',
        mode: 'no-cors',
        cache: 'no-cache',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8',
        },
        body: JSON.stringify(payload),
      });

      return { success: true };
    }

    // --- APP CHÍNH (SINGLE COMPONENT CONTAINER) ---
    function App() {
      const [videos, setVideos] = useState(() => {
        try {
          const saved = localStorage.getItem('roblox_tailoc_videos');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {
          console.warn('Lỗi đọc localStorage:', e);
        }
        return INITIAL_VIDEOS;
      });

      const [viewMode, setViewMode] = useState('table'); // 'table' | 'board'
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [envFilter, setEnvFilter] = useState('all');
      const [categoryFilter, setCategoryFilter] = useState('all');

      const [editingVideo, setEditingVideo] = useState(null);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [lightboxData, setLightboxData] = useState(null);
      const [toastMsg, setToastMsg] = useState(null);
      const fileImportRef = useRef(null);

      // Trạng thái Google Sheets Integration
      const [gasApiUrl, setGasApiUrl] = useState(() => {
        const stored = localStorage.getItem('roblox_gas_api_url');
        if (!stored || stored.includes('AUkAhnRPDDFcNXN6XmPuxN2Wt9iw0IckVtMH9PK6fn0khmysWanVkqglDngAi4aumo6Zj2adj') || stored.includes('script.googleusercontent.com')) {
          localStorage.setItem('roblox_gas_api_url', DEFAULT_SHEETS_API_URL);
          return DEFAULT_SHEETS_API_URL;
        }
        return stored;
      });
      const [isSheetsModalOpen, setIsSheetsModalOpen] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);
      const [lastSync, setLastSync] = useState(() => localStorage.getItem('roblox_gas_last_sync') || null);

      // Tự động lưu vào localStorage mỗi khi danh sách thay đổi
      useEffect(() => {
        try {
          localStorage.setItem('roblox_tailoc_videos', JSON.stringify(videos));
        } catch (e) {
          console.warn('Lỗi ghi localStorage:', e);
        }
      }, [videos]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      };

      // Sao chép toàn bộ tệp index.html vào clipboard
      const handleCopyFullHTML = async () => {
        try {
          let content = '';
          try {
            const resp = await fetch('index.html');
            if (resp.ok) {
              content = await resp.text();
            }
          } catch (e) {}
          if (!content || !content.includes('<!DOCTYPE html>')) {
            content = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
          }
          await navigator.clipboard.writeText(content);
          showToast('Đã sao chép toàn bộ mã nguồn tệp index.html thành công!');
        } catch (err) {
          console.error('Lỗi sao chép:', err);
          showToast('Không thể sao chép tự động, vui lòng dùng nút Tải index.html');
        }
      };

      // Tải tệp index.html trực tiếp về máy tính để đẩy lên GitHub
      const handleDownloadHTML = async () => {
        try {
          let content = '';
          try {
            const resp = await fetch('index.html');
            if (resp.ok) {
              content = await resp.text();
            }
          } catch (e) {}
          if (!content || !content.includes('<!DOCTYPE html>')) {
            content = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
          }
          const blob = new Blob([content], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'index.html';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('Đã tải xuống tệp index.html! Bạn có thể tải thẳng lên GitHub.');
        } catch (err) {
          console.error('Lỗi tải tệp:', err);
          showToast('Lỗi khi tải file. Vui lòng thử nút Copy index.html');
        }
      };

      // Gửi gói tin thử nghiệm (Test Ping) tới Google Sheets
      const handleTestSend = async () => {
        if (!gasApiUrl || !gasApiUrl.trim()) {
          showToast('Vui lòng nhập đường link Web App trước khi gửi thử!');
          return;
        }
        setIsSyncing(true);
        showToast('Đang gửi dữ liệu kiểm tra kết nối tới Google Sheets...');
        try {
          const testPayload = {
            action: 'ping_test',
            timestamp: new Date().toISOString(),
            stt: 999,
            tenVideo: 'Video Thử Nghiệm Kết Nối Google Sheets',
            theLoai: 'Test Connection',
            tienDo: 'Hoàn thành',
            tienDoPhanTram: 100,
            yTuong: 'Kiểm tra truyền nhận dữ liệu API Google Apps Script',
            boiCanh: 'Studio Roblox Hiện Đại',
            moiTruong: 'Studio Roblox Hiện Đại',
            nhanVat: 'Tailoc Gamer / System Bot',
            nhanVatA: 'Tailoc Gamer',
            nhanVatB: 'System Bot',
            daoCuThietBi: 'API Postman / Fetch Web App',
            kichBan: 'Phân cảnh 1: Gửi gói tin POST thành công về Google Sheets.',
            kichBanChiTiet: 'Phân cảnh 1: Gửi gói tin POST thành công về Google Sheets.',
            loiThoai: '1. [Hệ Thống]: "Đã kết nối thành công với Google Sheets của bạn!"',
            ghiChu: 'Test ping tự động từ giao diện người dùng'
          };
          await postToGoogleSheets(gasApiUrl.trim(), testPayload);
          const timeStr = new Date().toLocaleTimeString('vi-VN');
          setLastSync(timeStr);
          localStorage.setItem('roblox_gas_last_sync', timeStr);
          showToast(`Đã gửi gói tin thử nghiệm thành công (${timeStr})!`);
        } catch (err) {
          console.error('Lỗi test ping:', err);
          showToast('Lỗi khi gửi gói tin. Vui lòng kiểm tra lại link Web App!');
        } finally {
          setIsSyncing(false);
        }
      };

      // Đồng bộ toàn bộ danh sách hiện tại lên Google Sheets
      const handleSyncAllToSheets = async () => {
        if (!gasApiUrl || !gasApiUrl.trim()) {
          setIsSheetsModalOpen(true);
          return;
        }
        setIsSyncing(true);
        showToast(`Đang đồng bộ ${videos.length} video lên Google Sheets...`);
        try {
          const payload = {
            action: 'sync_all',
            timestamp: new Date().toISOString(),
            total: videos.length,
            videos: videos.map((v) => ({
              stt: v.stt,
              tenVideo: v.tenVideo,
              yTuong: v.yTuong,
              boiCanh: v.moiTruong,
              moiTruong: v.moiTruong,
              nhanVat: [v.nhanVatA, v.nhanVatB].filter(Boolean).join(' | '),
              nhanVatA: v.nhanVatA || '',
              nhanVatB: v.nhanVatB || '',
              theLoai: v.theLoai,
              tienDo: STATUS_CONFIG[v.tienDo]?.label || v.tienDo,
              tienDoPhanTram: v.tienDoPhanTram,
              daoCuThietBi: v.daoCuThietBi,
              kichBan: v.kichBanChiTiet,
              kichBanChiTiet: v.kichBanChiTiet,
              loiThoai: (v.danhSachLoiThoai || []).map((l, i) => `${i + 1}. [${l.speakerName || l.speaker}]: "${l.text}" (${l.action || ''})`).join('\n'),
              ghiChu: v.ghiChu
            }))
          };
          await postToGoogleSheets(gasApiUrl.trim(), payload);
          const timeStr = new Date().toLocaleTimeString('vi-VN');
          setLastSync(timeStr);
          localStorage.setItem('roblox_gas_last_sync', timeStr);
          showToast(`Đã đồng bộ toàn bộ ${videos.length} video lên Google Sheets (${timeStr})!`);
        } catch (err) {
          console.error('Lỗi đồng bộ:', err);
          showToast('Lỗi khi gửi lên Google Sheets. Vui lòng kiểm tra lại link Web App!');
        } finally {
          setIsSyncing(false);
        }
      };

      // Bộ lọc dữ liệu
      const filteredVideos = useMemo(() => {
        return videos.filter((v) => {
          const q = searchQuery.toLowerCase().trim();
          if (q) {
            const matchName = v.tenVideo?.toLowerCase().includes(q);
            const matchIdea = v.yTuong?.toLowerCase().includes(q);
            const matchCharA = v.nhanVatA?.toLowerCase().includes(q);
            const matchCharB = v.nhanVatB?.toLowerCase().includes(q);
            const matchNote = v.ghiChu?.toLowerCase().includes(q);
            if (!matchName && !matchIdea && !matchCharA && !matchCharB && !matchNote) return false;
          }
          if (statusFilter !== 'all' && v.tienDo !== statusFilter) return false;
          if (envFilter !== 'all' && v.moiTruong !== envFilter) return false;
          if (categoryFilter !== 'all' && v.theLoai !== categoryFilter) return false;
          return true;
        });
      }, [videos, searchQuery, statusFilter, envFilter, categoryFilter]);

      // Thống kê nhanh
      const stats = useMemo(() => {
        const total = videos.length;
        const completed = videos.filter((v) => v.tienDo === 'hoan_thanh').length;
        const inProgress = videos.filter((v) => v.tienDo !== 'hoan_thanh' && v.tienDo !== 'y_tuong').length;
        const avgPercent = total > 0 ? Math.round(videos.reduce((s, v) => s + (v.tienDoPhanTram || 0), 0) / total) : 0;
        return { total, completed, inProgress, avgPercent };
      }, [videos]);

      // Thao tác CRUD
      const handleAddNew = () => {
        const newVid = {
          id: 'new-' + Date.now(),
          stt: videos.length + 1,
          tenVideo: '',
          theLoai: 'Roblox Roleplay',
          yTuong: '',
          moiTruong: 'Studio Roblox Hiện Đại',
          nhanVatA: 'Tailoc Gamer',
          nhanVatB: '',
          tienDo: 'y_tuong',
          tienDoPhanTram: 10,
          ngayTao: new Date().toISOString().slice(0, 10),
          uuTien: 'Trung bình',
          kichBanChiTiet: '',
          danhSachLoiThoai: [],
          daoCuThietBi: ''
        };
        setEditingVideo(newVid);
        setIsModalOpen(true);
      };

      // LƯU DỰ ÁN VÀ TỰ ĐỘNG GỬI VỀ GOOGLE SHEETS
      const handleSaveVideo = async (savedVideo) => {
        let updatedList;
        if (videos.some((v) => v.id === savedVideo.id)) {
          updatedList = videos.map((v) => (v.id === savedVideo.id ? savedVideo : v));
          setVideos(updatedList);
          showToast('Đã cập nhật dự án vào bộ nhớ!');
        } else {
          updatedList = [...videos, savedVideo];
          setVideos(updatedList);
          showToast('Đã thêm dự án mới vào bộ nhớ!');
        }
        setIsModalOpen(false);

        // Chuẩn bị dữ liệu chi tiết đầy đủ (STT, Tên Video, Ý Tưởng, Bối Cảnh, Nhân Vật, Kịch Bản, Lời Thoại)
        const formattedDialogue = (savedVideo.danhSachLoiThoai || [])
          .map((item, idx) => `${idx + 1}. [${item.speakerName || item.speaker || 'Nhân vật'}]: "${item.text || ''}" ${item.action ? `(Hành động: ${item.action})` : ''} ${item.scene ? `[Cảnh: ${item.scene}]` : ''}`)
          .join('\n');

        const nhanVatCombined = [savedVideo.nhanVatA, savedVideo.nhanVatB].filter(Boolean).join(' | ');

        const sheetsPayload = {
          action: 'save_video',
          timestamp: new Date().toISOString(),
          stt: savedVideo.stt || 1,
          tenVideo: savedVideo.tenVideo || 'Chưa đặt tên',
          yTuong: savedVideo.yTuong || '',
          boiCanh: savedVideo.moiTruong || '',
          moiTruong: savedVideo.moiTruong || '',
          nhanVat: nhanVatCombined,
          nhanVatA: savedVideo.nhanVatA || '',
          nhanVatB: savedVideo.nhanVatB || '',
          theLoai: savedVideo.theLoai || 'Roblox Roleplay',
          tienDo: STATUS_CONFIG[savedVideo.tienDo]?.label || savedVideo.tienDo || 'Chưa thực hiện',
          tienDoPhanTram: savedVideo.tienDoPhanTram || 0,
          ngayDuKien: savedVideo.ngayDuKien || '',
          daoCuThietBi: savedVideo.daoCuThietBi || '',
          ghiChu: savedVideo.ghiChu || '',
          kichBan: savedVideo.kichBanChiTiet || '',
          kichBanChiTiet: savedVideo.kichBanChiTiet || '',
          loiThoai: formattedDialogue,
          danhSachLoiThoai: savedVideo.danhSachLoiThoai || [],
          ngayCapNhat: new Date().toLocaleString('vi-VN'),
          row: [
            savedVideo.stt || 1,
            new Date().toLocaleString('vi-VN'),
            savedVideo.tenVideo || '',
            savedVideo.theLoai || '',
            STATUS_CONFIG[savedVideo.tienDo]?.label || savedVideo.tienDo || '',
            `${savedVideo.tienDoPhanTram || 0}%`,
            savedVideo.yTuong || '',
            savedVideo.moiTruong || '',
            nhanVatCombined,
            savedVideo.daoCuThietBi || '',
            savedVideo.kichBanChiTiet || '',
            formattedDialogue,
            savedVideo.ghiChu || ''
          ]
        };

        // Tự động gửi POST đến Google Apps Script Web App
        if (gasApiUrl && gasApiUrl.trim()) {
          showToast('Đang lưu & tự động gửi dữ liệu lên Google Sheets...');
          setIsSyncing(true);
          try {
            await postToGoogleSheets(gasApiUrl.trim(), sheetsPayload);
            const timeStr = new Date().toLocaleTimeString('vi-VN');
            setLastSync(timeStr);
            localStorage.setItem('roblox_gas_last_sync', timeStr);
            showToast(`Đã lưu dự án & gửi lên Google Sheets thành công (${timeStr})!`);
          } catch (err) {
            console.error('Lỗi gửi dữ liệu sang Google Sheets:', err);
            showToast('Đã lưu nội bộ. Không thể gửi Google Sheets (vui lòng kiểm tra link API)!');
          } finally {
            setIsSyncing(false);
          }
        }
      };

      const handleDeleteVideo = (id) => {
        if (confirm('Bạn có chắc chắn muốn xóa video này khỏi kế hoạch?')) {
          setVideos(videos.filter((v) => v.id !== id));
          showToast('Đã xóa video!');
        }
      };

      const handleDuplicateVideo = (vid) => {
        const duplicated = {
          ...vid,
          id: 'dup-' + Date.now(),
          stt: videos.length + 1,
          tenVideo: `${vid.tenVideo} (Bản sao)`,
        };
        setVideos([...videos, duplicated]);
        showToast('Đã nhân bản video thành công!');
      };

      const handleMoveUp = (index) => {
        if (index <= 0) return;
        const newArr = [...videos];
        const temp = newArr[index];
        newArr[index] = newArr[index - 1];
        newArr[index - 1] = temp;
        // Cập nhật lại STT
        newArr.forEach((v, i) => (v.stt = i + 1));
        setVideos(newArr);
      };

      const handleMoveDown = (index) => {
        if (index >= videos.length - 1) return;
        const newArr = [...videos];
        const temp = newArr[index];
        newArr[index] = newArr[index + 1];
        newArr[index + 1] = temp;
        newArr.forEach((v, i) => (v.stt = i + 1));
        setVideos(newArr);
      };

      const handleQuickStatus = (id, newStatus) => {
        setVideos(
          videos.map((v) =>
            v.id === id
              ? {
                  ...v,
                  tienDo: newStatus,
                  tienDoPhanTram: STATUS_CONFIG[newStatus]?.defaultPercent || v.tienDoPhanTram,
                }
              : v
          )
        );
        showToast(`Đã chuyển trạng thái sang ${STATUS_CONFIG[newStatus]?.label || newStatus}`);
      };

      const handleResetSample = () => {
        if (confirm('Khôi phục danh sách về 4 video mẫu Roblox đầy đủ ban đầu? Dữ liệu tự tạo sẽ được làm mới.')) {
          setVideos(INITIAL_VIDEOS);
          localStorage.removeItem('roblox_tailoc_videos');
          showToast('Đã khôi phục dữ liệu mẫu Roblox Tailoc thành công!');
        }
      };

      const handleExcelImport = (e) => {
        const file = e.target.files?.[0];
        if (!file || !window.XLSX) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const wb = window.XLSX.read(data, { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const json = window.XLSX.utils.sheet_to_json(ws, { header: 1 });
            if (json.length < 5) {
              alert('Tệp Excel không đúng định dạng');
              return;
            }
            // Tìm dòng header
            const rows = json.slice(4);
            const imported = [];
            rows.forEach((r, idx) => {
              if (r && r[1]) {
                imported.push({
                  id: 'imp-' + Date.now() + '-' + idx,
                  stt: r[0] || idx + 1,
                  tenVideo: String(r[1] || ''),
                  theLoai: String(r[2] || 'Roblox Roleplay'),
                  tienDo: 'kich_ban',
                  tienDoPhanTram: parseInt(String(r[4] || '25').replace('%', '')) || 25,
                  yTuong: String(r[5] || ''),
                  moiTruong: String(r[6] || 'Studio Roblox'),
                  nhanVatA: String(r[7] || ''),
                  nhanVatB: String(r[8] || ''),
                  ngayDuKien: String(r[9] || ''),
                  ghiChu: String(r[10] || ''),
                  daoCuThietBi: String(r[11] || ''),
                });
              }
            });
            if (imported.length) {
              setVideos([...videos, ...imported]);
              showToast(`Đã nhập thành công ${imported.length} video từ Excel!`);
            }
          } catch (err) {
            alert('Lỗi đọc Excel: ' + err.message);
          }
        };
        reader.readAsArrayBuffer(file);
      };

      return (
        <div className="max-w-7xl mx-auto p-3 sm:p-6 space-y-5">
          {/* HEADER CHÍNH */}
          <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 p-4 sm:p-5 bg-[#0e123a] border border-[#1f2766] rounded-2xl shadow-xl">
            <div className="flex items-center gap-3.5">
              <div className="w-12 h-12 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-lg shadow-blue-600/30 border border-blue-400/40 shrink-0">
                <Icon name="Gamepad2" size={26} />
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-xl sm:text-2xl font-extrabold tracking-tight text-white flex items-center gap-2">
                    <span>ROBLOX TAILOC</span>
                  </h1>
                  <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-500/20 text-blue-300 border border-blue-400/30">
                    Studio Pro
                  </span>
                </div>
                <p className="text-xs text-slate-400 mt-0.5">
                  Hệ thống quản lý sản xuất video, kịch bản, lời thoại & tiến độ dự án
                </p>
              </div>
            </div>

            {/* Các nút hành động chính */}
            <div className="flex items-center gap-2 flex-wrap">
              <button
                type="button"
                onClick={handleAddNew}
                className="px-3.5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-lg shadow-blue-600/25 transition-all cursor-pointer"
              >
                <Icon name="Plus" size={15} />
                <span>Thêm Video Mới</span>
              </button>

              <button
                type="button"
                onClick={handleSyncAllToSheets}
                disabled={isSyncing}
                className="px-3 py-2 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 hover:text-white border border-emerald-500/40 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-colors cursor-pointer"
                title="Đồng bộ toàn bộ danh sách video sang Google Sheets"
              >
                <Icon name={isSyncing ? "Loader2" : "RefreshCw"} size={14} className={isSyncing ? "animate-spin text-emerald-400" : "text-emerald-400"} />
                <span>{isSyncing ? "Đang Gửi..." : "Đồng Bộ Sheets"}</span>
              </button>

              <button
                type="button"
                onClick={() => setIsSheetsModalOpen(true)}
                className="px-3 py-2 bg-[#141846] hover:bg-[#1a205a] text-slate-200 hover:text-white border border-[#273278] rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-colors cursor-pointer"
                title="Cấu hình kết nối Google Sheets Web App API"
              >
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
                <Icon name="Sheet" size={14} className="text-emerald-400" />
                <span>Google Sheets</span>
              </button>

              <button
                type="button"
                onClick={() => exportToExcel(videos)}
                className="px-3 py-2 bg-[#141846] hover:bg-[#1a205a] text-emerald-300 hover:text-white border border-emerald-500/30 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-colors"
                title="Xuất danh sách ra tệp Excel (.xlsx)"
              >
                <Icon name="Download" size={14} />
                <span>Xuất Excel</span>
              </button>

              <button
                type="button"
                onClick={() => fileImportRef.current?.click()}
                className="px-3 py-2 bg-[#141846] hover:bg-[#1a205a] text-blue-300 hover:text-white border border-[#273278] rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-colors"
                title="Nhập danh sách từ tệp Excel (.xlsx)"
              >
                <Icon name="Upload" size={14} />
                <span>Nhập Excel</span>
              </button>
              <input type="file" ref={fileImportRef} onChange={handleExcelImport} accept=".xlsx,.xls" className="hidden" />

              <button
                type="button"
                onClick={handleDownloadHTML}
                className="px-3 py-2 bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 hover:text-white border border-blue-500/40 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-colors cursor-pointer shadow-sm"
                title="Tải tệp index.html về máy tính để tải lên GitHub"
              >
                <Icon name="Download" size={14} className="text-blue-400" />
                <span>Tải index.html</span>
              </button>

              <button
                type="button"
                onClick={handleCopyFullHTML}
                className="px-3 py-2 bg-[#141846] hover:bg-[#1a205a] text-slate-200 hover:text-white border border-[#273278] rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-colors cursor-pointer"
                title="Sao chép toàn bộ mã nguồn tệp index.html để dán sử dụng"
              >
                <Icon name="Copy" size={14} className="text-blue-400" />
                <span>Copy index.html</span>
              </button>

              <button
                type="button"
                onClick={() => window.print()}
                className="p-2 bg-[#141846] hover:bg-[#1a205a] text-slate-300 hover:text-white border border-[#273278] rounded-xl text-xs"
                title="In danh sách / Xuất PDF"
              >
                <Icon name="Printer" size={15} />
              </button>

              <button
                type="button"
                onClick={handleResetSample}
                className="p-2 bg-[#141846] hover:bg-[#1a205a] text-slate-400 hover:text-rose-300 border border-[#273278] rounded-xl text-xs"
                title="Khôi phục dữ liệu 4 video mẫu ban đầu"
              >
                <Icon name="RotateCcw" size={15} />
              </button>
            </div>
          </header>

          {/* THỐNG KÊ NHANH & TIẾN ĐỘ TỔNG THỂ */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div className="p-3.5 bg-[#0e1136] border border-[#1f2766] rounded-xl flex items-center justify-between">
              <div>
                <div className="text-[11px] font-semibold text-slate-400">Tổng Số Video</div>
                <div className="text-xl font-extrabold text-white mt-0.5">{stats.total}</div>
              </div>
              <div className="w-8 h-8 rounded-lg bg-blue-500/10 text-blue-400 flex items-center justify-center">
                <Icon name="Video" size={18} />
              </div>
            </div>

            <div className="p-3.5 bg-[#0e1136] border border-[#1f2766] rounded-xl flex items-center justify-between">
              <div>
                <div className="text-[11px] font-semibold text-slate-400">Đang Sản Xuất</div>
                <div className="text-xl font-extrabold text-amber-400 mt-0.5">{stats.inProgress}</div>
              </div>
              <div className="w-8 h-8 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center">
                <Icon name="Clock" size={18} />
              </div>
            </div>

            <div className="p-3.5 bg-[#0e1136] border border-[#1f2766] rounded-xl flex items-center justify-between">
              <div>
                <div className="text-[11px] font-semibold text-slate-400">Đã Hoàn Thành</div>
                <div className="text-xl font-extrabold text-emerald-400 mt-0.5">{stats.completed}</div>
              </div>
              <div className="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center">
                <Icon name="CheckCircle2" size={18} />
              </div>
            </div>

            <div className="p-3.5 bg-[#0e1136] border border-[#1f2766] rounded-xl space-y-1">
              <div className="flex justify-between items-center text-[11px]">
                <span className="font-semibold text-slate-400">Tiến Độ Kênh</span>
                <span className="font-extrabold text-blue-400">{stats.avgPercent}%</span>
              </div>
              <div className="w-full h-2 bg-[#090b24] rounded-full overflow-hidden">
                <div
                  className="h-full bg-gradient-to-r from-blue-500 via-indigo-500 to-emerald-400 rounded-full transition-all duration-500"
                  style={{ width: `${stats.avgPercent}%` }}
                />
              </div>
            </div>
          </div>

          {/* THANH TÌM KIẾM, LỌC & CHUYỂN ĐỔI GIAO DIỆN (TABLE / KANBAN) */}
          <div className="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3 p-3.5 bg-[#0e1136] border border-[#1f2766] rounded-xl">
            {/* Search Box */}
            <div className="relative flex-1">
              <Icon name="Search" size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Tìm video theo tên, ý tưởng, nhân vật A/B, ghi chú..."
                className="w-full bg-[#080922] border border-[#1f265c] rounded-lg pl-9 pr-3 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500"
              />
              {searchQuery && (
                <button
                  onClick={() => setSearchQuery('')}
                  className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white"
                >
                  <Icon name="X" size={14} />
                </button>
              )}
            </div>

            {/* Bộ lọc tiến độ & bối cảnh */}
            <div className="flex items-center gap-2 flex-wrap">
              <select
                value={statusFilter}
                onChange={(e) => setStatusFilter(e.target.value)}
                className="bg-[#080922] border border-[#1f265c] rounded-lg px-2.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500"
              >
                <option value="all">Tất cả tiến độ</option>
                {Object.entries(STATUS_CONFIG).map(([k, c]) => (
                  <option key={k} value={k}>{c.label}</option>
                ))}
              </select>

              <select
                value={categoryFilter}
                onChange={(e) => setCategoryFilter(e.target.value)}
                className="bg-[#080922] border border-[#1f265c] rounded-lg px-2.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500"
              >
                <option value="all">Tất cả thể loại</option>
                {PRESET_CATEGORIES.map((c, i) => (
                  <option key={i} value={c}>{c}</option>
                ))}
              </select>

              {/* Nút chuyển chế độ xem: Bảng (Table) hoặc Bảng Kanban (Board) */}
              <div className="flex items-center bg-[#080922] border border-[#1f265c] rounded-lg p-0.5">
                <button
                  type="button"
                  onClick={() => setViewMode('table')}
                  className={`px-3 py-1.5 rounded-md text-xs font-bold flex items-center gap-1.5 transition-colors ${
                    viewMode === 'table' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <Icon name="Table" size={14} />
                  <span>Dạng Bảng</span>
                </button>
                <button
                  type="button"
                  onClick={() => setViewMode('board')}
                  className={`px-3 py-1.5 rounded-md text-xs font-bold flex items-center gap-1.5 transition-colors ${
                    viewMode === 'board' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <Icon name="Kanban" size={14} />
                  <span>Kanban</span>
                </button>
              </div>
            </div>
          </div>

          {/* NỘI DUNG HIỂN THỊ CHÍNH (TABLE HOẶC KANBAN) */}
          <main>
            {viewMode === 'table' ? (
              <VideoTable
                videos={filteredVideos}
                onEdit={(v) => {
                  setEditingVideo(v);
                  setIsModalOpen(true);
                }}
                onDelete={handleDeleteVideo}
                onDuplicate={handleDuplicateVideo}
                onMoveUp={handleMoveUp}
                onMoveDown={handleMoveDown}
                onQuickStatus={handleQuickStatus}
                onOpenLightbox={(url, title, sub) => setLightboxData({ url, title, sub })}
              />
            ) : (
              <VideoBoard
                videos={filteredVideos}
                onEdit={(v) => {
                  setEditingVideo(v);
                  setIsModalOpen(true);
                }}
                onDelete={handleDeleteVideo}
                onDuplicate={handleDuplicateVideo}
                onQuickStatus={handleQuickStatus}
                onOpenLightbox={(url, title, sub) => setLightboxData({ url, title, sub })}
              />
            )}
          </main>

          {/* FOOTER */}
          <footer className="pt-6 pb-4 border-t border-[#1f2766] text-center text-xs text-slate-500 space-y-1">
            <div>ROBLOX TAILOC PRODUCTION MANAGEMENT</div>
            <div>Hệ thống quản lý sản xuất video, kịch bản & tiến độ dự án</div>
          </footer>

          {/* MODALS */}
          <VideoModal
            isOpen={isModalOpen}
            onClose={() => setIsModalOpen(false)}
            video={editingVideo}
            onSave={handleSaveVideo}
          />

          <GoogleSheetsModal
            isOpen={isSheetsModalOpen}
            onClose={() => setIsSheetsModalOpen(false)}
            apiUrl={gasApiUrl}
            onSaveUrl={(newUrl) => {
              setGasApiUrl(newUrl);
              localStorage.setItem('roblox_gas_api_url', newUrl);
              showToast('Đã lưu link Web App Google Apps Script mới!');
            }}
            onTestSend={handleTestSend}
            isSyncing={isSyncing}
            lastSync={lastSync}
            onSyncAll={handleSyncAllToSheets}
            onCopyFullHTML={handleCopyFullHTML}
            onDownloadHTML={handleDownloadHTML}
          />

          <LightboxModal
            isOpen={!!lightboxData}
            onClose={() => setLightboxData(null)}
            imageUrl={lightboxData?.url}
            title={lightboxData?.title}
            subtitle={lightboxData?.sub}
          />

          {/* THÔNG BÁO TOAST */}
          {toastMsg && (
            <div className="fixed bottom-5 right-5 z-50 px-4 py-2.5 bg-blue-600 text-white rounded-xl shadow-2xl font-bold text-xs flex items-center gap-2 border border-blue-400/40 animate-bounce">
              <Icon name="CheckCircle2" size={16} />
              <span>{toastMsg}</span>
            </div>
          )}
        </div>
      );
    }

    // Render Ứng Dụng vào #root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
